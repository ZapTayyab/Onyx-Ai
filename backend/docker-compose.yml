version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SNT_ENVIRONMENT=development
      - SNT_AUTH_PROVIDER=local
      - SNT_POSTGRES_DSN=postgresql+asyncpg://snt:snt@postgres:5432/snt_ai
      - SNT_CLICKHOUSE_HOST=clickhouse
      - SNT_REDIS_DSN=redis://redis:6379/0
      - SNT_ENCRYPTION_KEY=dev-secret-key-change-in-production
      - SNT_CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://localhost:8501"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=snt
      - POSTGRES_PASSWORD=snt
      - POSTGRES_DB=snt_ai
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snt"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DB=snt_ai
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clickhouse_data:
