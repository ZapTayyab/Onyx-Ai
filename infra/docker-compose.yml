x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: snt-postgres
    environment:
      POSTGRES_DB: snt_ai
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    # NOTE: No host port binding — Postgres is internal-only.
    # To connect from your machine during development, use:
    #   docker compose exec postgres psql -U $POSTGRES_USER snt_ai
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snt} -d snt_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: snt-clickhouse
    environment:
      CLICKHOUSE_DB: snt_ai
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # NOTE: No host port binding — ClickHouse is internal-only.
    expose:
      - "8123"
      - "9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: snt-redis
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # NOTE: No host port binding — Redis is internal-only.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: snt-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_VALUE: "{}"
    # NOTE: No host port binding — Temporal gRPC and UI are internal-only.
    expose:
      - "7233"
      - "8233"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:1.25
    container_name: snt-temporal-admin
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: snt-backend
    environment:
      SNT_ENVIRONMENT: ${SNT_ENVIRONMENT:-production}
      SNT_DEBUG: ${SNT_DEBUG:-false}
      SNT_LOG_LEVEL: ${SNT_LOG_LEVEL:-INFO}
      SNT_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/snt_ai
      SNT_CLICKHOUSE_HOST: clickhouse
      SNT_CLICKHOUSE_PORT: 8123
      SNT_CLICKHOUSE_DATABASE: snt_ai
      SNT_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SNT_REDIS_DSN: redis://:${REDIS_PASSWORD}@redis:6379/0
      SNT_TEMPORAL_HOST: temporal:7233
      SNT_AUTH_PROVIDER: ${SNT_AUTH_PROVIDER:?SNT_AUTH_PROVIDER must be set (clerk|auth0|local)}
      SNT_CLERK_SECRET_KEY: ${SNT_CLERK_SECRET_KEY:-}
      SNT_CLERK_PUBLISHABLE_KEY: ${SNT_CLERK_PUBLISHABLE_KEY:-}
      SNT_ENCRYPTION_KEY: ${SNT_ENCRYPTION_KEY:?SNT_ENCRYPTION_KEY must be set}
      SNT_CORS_ORIGINS: ${SNT_CORS_ORIGINS:?SNT_CORS_ORIGINS must be set to your production domain}
      SNT_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # NOTE: No host port binding — Backend is internal-only, reverse-proxied by Caddy.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: snt-frontend
    # NOTE: No host port binding — Frontend is internal-only, reverse-proxied by Caddy.
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:8000/v1
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: snt-caddy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      TLS_CONFIG: ${TLS_CONFIG:-tls internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    logging: *default-logging
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: snt-otel
    command: ["--config=/etc/otel-collector-config.yml"]
    # NOTE: No host port binding — OTel collector is internal-only.
    expose:
      - "4317"
      - "4318"
      - "8888"
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: snt-prometheus
    # NOTE: No host port binding — Prometheus is internal-only.
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml
      - prometheus_data:/prometheus
    logging: *default-logging
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: snt-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/snt_ai?sslmode=disable"
    # NOTE: No host port binding — pg-exporter is internal-only.
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: snt-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # NOTE: No host port binding — Jaeger UI is internal-only.
    expose:
      - "16686"
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: snt-grafana
    # Grafana is internal-only by default. To expose it, add a port binding here
    # and place it behind your reverse proxy with auth (e.g. Caddy basic_auth).
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
