global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "snt-ai"
    namespace: "default"

rule_files:
  - "alerting-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "otel-collector"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "snt-backend"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "postgres"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "clickhouse"
    scrape_interval: 15s
    static_configs:
      - targets: ["clickhouse:8123"]

  - job_name: "temporal-server"
    scrape_interval: 15s
    static_configs:
      - targets: ["temporal:8233"]
